<div class="animate-in space-y-6">
    <!-- Header -->
    <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
      <div>
        <p class="eyebrow mb-2">Insights & exports</p>
        <h1 class="font-display text-3xl font-bold tracking-[-0.04em] text-[var(--ink)]">Reports</h1>
        <p class="mt-1 text-sm text-[var(--ink-muted)]">Turn portfolio activity into clear, useful decisions.</p>
      </div>
      <span class="rounded-full bg-[var(--brand-soft)] px-3 py-1.5 text-[10px] font-bold text-[var(--brand)]"><i class="pi pi-file mr-2"></i>Report center</span>
    </div>

    <!-- Report Templates -->
    <app-report-templates></app-report-templates>

    <!-- Custom Report Builder -->
    <app-custom-report-builder
      [form]="customReportForm"
      [propertyOptions]="propertyOptions"
      [selectedMetrics]="selectedMetrics"
      (preview)="previewReport()"
      (generate)="generateReport()">
    </app-custom-report-builder>

    <!-- Report History -->
    <app-report-history></app-report-history>
</div>
