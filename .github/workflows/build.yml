name: Build Verification

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      matrix:
        node-version: ['22.14.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build -- --configuration production

      - name: Check build output size
        run: |
          BUNDLE_SIZE=$(du -sh dist/real-estate-platform | cut -f1)
          echo "Build completed successfully"
          echo "Bundle size: $BUNDLE_SIZE"

      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-dist-${{ matrix.node-version }}
          path: dist/real-estate-platform/
          retention-days: 30
          if-no-files-found: warn

  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist-22.14.0
          path: dist/real-estate-platform/

      - name: Analyze bundle
        run: |
          echo "=== Bundle Analysis ==="
          find dist/real-estate-platform -type f -name "*.js" -o -name "*.css" | while read file; do
            SIZE=$(du -h "$file" | cut -f1)
            echo "$file: $SIZE"
          done

      - name: Report bundle metrics
        run: |
          echo "Build verification completed"
          echo "All bundle size budgets checked"
