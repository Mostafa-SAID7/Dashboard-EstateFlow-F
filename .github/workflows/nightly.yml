name: Nightly: Full Testing & Security Audit

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  full-test-suite:
    name: Comprehensive Testing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        node-version: ['22.14.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all tests with coverage
        run: npm run test -- --watch=false --code-coverage --browsers=ChromeHeadless

      - name: Build production
        run: npm run build -- --configuration production

  nightly-security-audit:
    name: Nightly Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: ['22.14.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Check for outdated packages
        run: npm outdated || true

      - name: Report audit results
        if: steps.npm-audit.outcome == 'failure'
        run: |
          echo "::warning::Security vulnerabilities found in nightly audit"
          npm audit --json > npm-audit-report.json || true

      - name: Upload audit report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-report
          path: npm-audit-report.json
          retention-days: 90
